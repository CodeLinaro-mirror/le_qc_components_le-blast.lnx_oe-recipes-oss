[Unit]
DefaultDependencies=no
After=basic.target
[Service]
ExecStartPre=/bin/sh -c '\
i=0; \
R=/sys/class/usb_role/a600000.ssusb-role-switch/role; \
while [ ! -e "$R" ] && [ "$i" -lt 30 ]; do \
    sleep 1; \
    i=$((i + 1)); \
done; \
if [ -e "$R" ]; then \
    echo "role-switch wait: ${i}s, present=y"; \
else \
    echo "role-switch wait: timeout after ${i}s, present=n" >&2; \
    exit 1; \
fi'
ExecStartPre=/bin/sh -c '\
i=0; \
M=/sys/bus/platform/devices/a600000.ssusb/mode; \
while [ "$i" -lt 30 ]; do \
    MODE=$(cat "$M" 2>/dev/null); \
    if [ "$MODE" = "peripheral" ]; then \
        echo "usb-mode: peripheral confirmed at ${i}s"; \
        break; \
    fi; \
    echo peripheral > "$M" 2>/dev/null; \
    sleep 1; \
    i=$((i + 1)); \
done; \
if [ "$MODE" != "peripheral" ]; then \
    echo "usb-mode: failed to set peripheral after ${i}s" >&2; \
fi'
